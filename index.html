<!doctype html>
<html lang="de" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>Gym</title>
  <meta name="description" content="Private Trainings-App: Pläne, Training, Supplements." />

  <!-- iOS Home-Screen / PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <!-- Nicht "black-translucent": iOS macht die Web-Ansicht dann kürzer, hängt
       sie aber oben an – der fehlende Streifen landet unten, wo die Tableiste
       sitzt. Mit "default" beginnt die Seite unter der Statusleiste und reicht
       bis zur echten Unterkante. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Gym" />
  <meta name="theme-color" content="#f4f4f7" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/app.css" />
  <!-- Hell/Dunkel schon vor dem ersten Bild setzen, sonst blitzt es kurz auf. -->
  <script>
    try {
      var s = JSON.parse(localStorage.getItem('gym.settings') || '{}');
      var dark = s.v >= 2 && (s.theme === 'dark' || (s.theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches));
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.querySelector('meta[name="theme-color"]').content = dark ? '#000000' : '#f4f4f7';
    } catch (e) { /* ohne Einstellungen: hell */ }
  </script>
</head>
<body>
  <div id="app-root"></div>
  <div id="workout-root"></div>
  <div id="sheet-root"></div>
  <div id="toast-root"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
