<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>Gym</title>
  <meta name="description" content="Private Trainings-App für Workout-Logging, Routinen und Fortschritt." />

  <!-- iOS Home-Screen / PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <!-- Nicht "black-translucent": iOS macht die Web-Ansicht dann um die Höhe der
       Statusleiste kürzer, hängt sie aber oben an – der fehlende Streifen
       landet unten, wo die Navigationsleiste sitzt, und ist per CSS nicht
       erreichbar. Mit "default" beginnt die Seite unter der Statusleiste und
       reicht dafür bis zur echten Unterkante. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Gym" />
  <!-- Färbt den Streifen der Statusleiste wie die Kopfzeile darunter. -->
  <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app-root"></div>
  <div id="sheet-root"></div>
  <div id="toast-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
